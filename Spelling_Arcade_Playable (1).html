<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelling Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef8ff,#fff9ee 55%,#f4f1ff);color:#243047}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}
header{height:82px;background:#fff;border-bottom:1px solid #dbe5ef;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{border:0;background:none;display:flex;gap:12px;align-items:center;text-align:left;color:#17243c}.brand b{font-size:20px;display:block}.brand small{color:#7d8ba1;font-weight:700}
.logo{width:44px;height:44px;background:#e0f2fe;border:2px solid #7dd3fc;border-radius:14px;display:grid;place-items:center;font-size:23px}
.stats{display:flex;gap:10px;font-size:13px;font-weight:900}.stats span{background:#f8fafc;border:1px solid #e2e8f0;padding:8px 12px;border-radius:999px}
.container{max-width:1120px;margin:auto;padding:28px 20px 50px}.hero{background:#fff;border:4px solid #bae6fd;border-radius:28px;padding:25px;display:flex;justify-content:space-between;align-items:center;gap:24px;box-shadow:0 8px 24px #164e6312}
.pill{display:inline-block;background:#fef3c7;border:1px solid #fcd34d;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:900}.hero h1{font-size:30px;margin:12px 0 16px}
.words{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.words b{font-size:11px;color:#94a3b8;margin-right:3px}.words span{background:#eff8ff;border:1px solid #bae6fd;color:#075985;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.words em{font-size:12px;color:#64748b;font-style:normal;font-weight:800}
.orange{border:0;background:#f97316;color:#fff;border-bottom:4px solid #c2410c;border-radius:16px;padding:13px 18px;font-weight:950;display:inline-flex;gap:9px;align-items:center;white-space:nowrap}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.sectionTitle h2{font-size:18px;margin:0}.sectionTitle span{font-size:12px;color:#64748b;font-weight:900}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.game{text-align:left;background:#fff;border:2px solid;border-bottom-width:5px;border-radius:26px;padding:21px;min-height:310px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.game:hover{transform:translateY(-3px)}
.game.blue{border-color:#7dd3fc}.game.purple{border-color:#c4b5fd}.game.green{border-color:#86efac}.gameIcon{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;color:white;margin-bottom:14px;font-size:27px}.blue .gameIcon{background:#0ea5e9}.purple .gameIcon{background:#8b5cf6}.green .gameIcon{background:#10b981}
.label{font-size:10px;font-weight:950;letter-spacing:1px}.blue .label{color:#0369a1}.purple .label{color:#6d28d9}.green .label{color:#047857}.game h3{font-size:21px;margin:7px 0}.game p{font-size:13px;color:#64748b;font-weight:700;line-height:1.5;margin:0}.game footer{border-top:1px solid #edf2f7;padding-top:13px;margin-top:18px;display:flex;justify-content:space-between}.game footer b{font-size:13px}.game footer span{background:#fef3c7;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:950}
.gameShell{max-width:850px;margin:auto;padding:30px 20px}.topline{display:flex;align-items:center;gap:22px;margin-bottom:25px}.topline h2{margin:0;font-size:27px}.topline small{font-weight:800;color:#64748b}.back{background:#fff;border:1px solid #dbe5ef;border-radius:12px;padding:9px 12px;font-weight:900}
.playcard{background:#fff;border:3px solid #cbd5e1;border-radius:28px;padding:35px;box-shadow:0 12px 35px #33415510;text-align:center}.sound{border:0;background:#e0f2fe;color:#075985;border:2px solid #7dd3fc;border-radius:18px;padding:13px 20px;font-weight:950}.hint{margin:18px auto;max-width:500px;color:#64748b;font-weight:800}
.playcard input{display:block;width:100%;max-width:560px;margin:15px auto;padding:16px;border:3px solid #cbd5e1;border-radius:16px;outline:none;font-size:20px;font-weight:900;text-align:center}.primary,.secondary{border:0;border-radius:15px;padding:13px 19px;font-weight:950}.primary{background:#0ea5e9;color:#fff;border-bottom:4px solid #0369a1}.purpleBtn{background:#8b5cf6;border-bottom-color:#6d28d9}.greenBtn{background:#10b981;border-bottom-color:#047857}
.tiles{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:25px}.tiles span{width:48px;height:52px;display:grid;place-items:center;background:#ede9fe;border:2px solid #c4b5fd;border-bottom:4px solid #8b5cf6;border-radius:13px;font-size:20px;font-weight:950;color:#5b21b6}
.mystery{font-size:42px;letter-spacing:10px;font-weight:950;color:#047857;background:#ecfdf5;border:2px dashed #6ee7b7;border-radius:18px;padding:20px;margin-bottom:15px}.playcard p{font-weight:800;color:#64748b}
.summary{max-width:700px;margin:70px auto;padding:30px 20px;text-align:center}.trophy{font-size:65px}.summary h1{font-size:34px;margin:5px}.summary p{font-size:17px;color:#64748b}.score{display:inline-block;background:#fef3c7;border:2px solid #fcd34d;border-radius:999px;padding:10px 18px;font-weight:950}.summaryBtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.secondary{background:#fff;border:2px solid #cbd5e1;color:#334155}
.overlay{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:25px;padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0}.modalHead button{border:0;background:#f1f5f9;border-radius:10px;padding:7px}.listRow{display:flex;border:2px solid #e2e8f0;border-radius:14px;margin:8px 0;overflow:hidden}.listRow.selected{border-color:#38bdf8;background:#f0f9ff}.listRow button:first-child{border:0;background:transparent;flex:1;text-align:left;padding:13px}.listRow b,.listRow small{display:block}.listRow small{color:#64748b;font-weight:700;margin-top:3px}.iconBtn{width:48px;border:0;background:#fff;color:#ef4444}.addBox{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:18px;padding:16px;margin-top:15px}.addBox h3{margin-top:0}.addBox input,.addBox textarea{width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:11px;margin-bottom:9px}.addBox textarea{min-height:110px;resize:vertical}.addBox .orange{width:100%;justify-content:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17243c;color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;z-index:30}
@media(max-width:800px){.games{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:25px}.orange{width:100%;justify-content:center}}
@media(max-width:520px){header{padding:10px 14px}.stats{gap:5px}.stats span{padding:7px}.brand b{font-size:16px}.container{padding:18px 13px}.gameShell{padding:20px 13px}.playcard{padding:22px 14px}.mystery{font-size:27px;letter-spacing:6px}}

.raceHud{background:#fff;border:3px solid #cbd5e1;border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 8px 22px #33415512}
.raceTop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:950}
.track{height:54px;margin-top:12px;background:repeating-linear-gradient(90deg,#dbeafe 0,#dbeafe 35px,#fff 35px,#fff 70px);border:3px solid #94a3b8;border-radius:14px;position:relative;overflow:hidden}
.track:after{content:"";position:absolute;left:0;right:0;top:24px;border-top:4px dashed #94a3b8}
.car{position:absolute;top:4px;left:0%;font-size:34px;z-index:2;transition:left .45s ease}
.finish{position:absolute;right:8px;top:3px;font-size:38px;z-index:1}
.speedBonus{display:inline-block;margin-top:8px;background:#fef3c7;border:1px solid #fcd34d;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:950;color:#92400e}
.raceWin{animation:boost .5s ease}
@keyframes boost{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const STARTER=["because","beautiful","different","favorite","friend","grammar","important","library","remember","together"];
const RANKS=[["Rookie","🌱",0],["Word Scout","🔎",50],["Spelling Star","⭐",150],["Word Wizard","🪄",300],["Spelling Champion","🏆",600]];
const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
let lists=get("spelling-lists",[{id:"starter",name:"Starter Words",words:STARTER}]);
let activeId=get("spelling-active","starter");
let progress=get("spelling-progress",{stars:0,streak:0,bestStreak:0,rounds:0,mastered:0});
let mode=null, words=[], index=0, summary=null, toastTimer;
function save(){localStorage.setItem("spelling-lists",JSON.stringify(lists));localStorage.setItem("spelling-active",JSON.stringify(activeId));localStorage.setItem("spelling-progress",JSON.stringify(progress))}
function active(){return lists.find(x=>x.id===activeId)||lists[0]}
function rank(){return [...RANKS].reverse().find(x=>progress.stars>=x[2])||RANKS[0]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function icon(s){return `<span style="font-size:25px">${s}</span>`}
function toast(s){clearTimeout(toastTimer);let x=document.querySelector(".toast");if(!x){x=document.createElement("div");x.className="toast";document.body.appendChild(x)}x.textContent=s;toastTimer=setTimeout(()=>x.remove(),1300)}
function home(){
mode=null;summary=null;render();
}
function start(m,custom){
let src=(custom&&custom.length?custom:active().words).filter(Boolean);
if(!src.length){toast("Add at least one word first!");return}
words=[...src].sort(()=>Math.random()-.5);index=0;summary=null;mode=m;render();
}
function award(ok){
if(ok){
progress.streak++;
let earned=10+(progress.streak===1?5:0)+(progress.streak>=3?5:0);
progress.stars+=earned;progress.bestStreak=Math.max(progress.bestStreak,progress.streak);progress.mastered++;
toast(progress.streak>=3?"🚀 SPEED BOOST! +"+earned+" ⭐":"🏎️ Correct! +"+earned+" ⭐");
}else progress.streak=0;
else progress.streak=0;
save();
}
function finish(correct,tricky){progress.rounds++;summary={correct,total:words.length,tricky,mode};save();render()}
function next(ok){
const tricky=ok?[]:[words[index]];
award(ok);
setTimeout(()=>{if(index+1<words.length){index++;render()}else finish(ok?1:0,tricky)},450);
}
function render(){
const a=active(),r=rank();
let html=`<header><button class="brand" onclick="home()"><span class="logo">✏️</span><div><b>Spelling Arcade</b><small>Practice • Play • Master</small></div></button><div class="stats"><span>${r[1]} ${r[0]}</span><span>⭐ ${progress.stars}</span><span>🔥 ${progress.streak}</span></div></header>`;
if(summary)html+=summaryView();else if(mode==="listen")html+=listenView();else if(mode==="scramble")html+=scrambleView();else if(mode==="missing")html+=missingView();else html+=homeView(a,r);
document.getElementById("app").innerHTML=html;
if(mode==="listen")setTimeout(speak,150);
}
function homeView(a,r){return `<main class="container"><section class="hero"><div><div class="pill">${r[1]} Rank: ${r[0]}</div><h1>Ready to master your spelling words?</h1><div class="words"><b>ACTIVE LIST (${a.words.length})</b>${a.words.slice(0,8).map(w=>`<span>${esc(w)}</span>`).join("")}${a.words.length>8?`<em>+${a.words.length-8} more</em>`:""}</div></div><button class="orange" onclick="openWords()">☷ My Word List (${a.words.length})</button></section><div class="sectionTitle"><h2>✨ Choose a Spelling Game</h2>${progress.bestStreak?`<span>🏆 Best Streak: ${progress.bestStreak}</span>`:""}</div><div class="games">
${card("blue","🎧","CLASSIC ARCADE","Listen & Spell","Hear each word spoken clearly and type the letters with helpful hints on try #2!","+15 ⭐/word","start('listen')")}
${card("purple","🔀","WORD BUILDER","Letter Scramble","Unscramble colorful letter tiles by clicking or typing to earn Speed Bonus stars!","+18 ⭐/word","start('scramble')")}
${card("green","🔎","DETECTIVE MODE","Missing Letters","Crack the spelling mystery by filling in the hidden blanks!","+15 ⭐/word","start('missing')")}
</div></main>`}
function card(c,ico,label,title,text,stars,fn){return `<button class="game ${c}" onclick="${fn}"><div><div class="gameIcon">${ico}</div><span class="label">${label}</span><h3>${title}</h3><p>${text}</p></div><footer><b>Play Now →</b><span>${stars}</span></footer></button>`}
function shell(title,sub,body){
let pct=Math.max(0,Math.min(100,(index/Math.max(1,words.length-1))*100));
return `<main class="gameShell">
<div class="topline"><button class="back" onclick="home()">← Back</button><div><h2>${title}</h2><small>${sub}</small></div></div>
<div class="raceHud"><div class="raceTop"><span>🏎️ SPELLING RACE</span><span>Lap ${index+1}/${words.length} • 🔥 ${progress.streak} streak</span></div>
<div class="track"><div class="car" id="raceCar" style="left:${pct}%">🏎️</div><div class="finish">🏁</div></div>
<div class="speedBonus">Correct answers make your car RACE forward!</div></div>
${body}</main>`}
function speak(){if(!words[index])return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index]);u.rate=.82;speechSynthesis.speak(u)}
function listenView(){return shell("Listen & Spell",`Word ${index+1} of ${words.length}`,`<div class="playcard"><button class="sound" onclick="speak()">🔊 Hear Word</button><div class="hint" id="hint">Type the word you hear.</div><input id="answer" autofocus onkeydown="if(event.key==='Enter')checkListen()" placeholder="Type the spelling here"><button class="primary" onclick="checkListen()">Check Spelling</button></div>`)}
function checkListen(){let v=document.getElementById("answer").value.trim().toLowerCase(),w=words[index].toLowerCase();if(v===w)next(true);else{let h=document.getElementById("hint");if(h.dataset.try!=="1"){h.dataset.try="1";h.textContent="Try again — first letter: "+words[index][0].toUpperCase()+"…";document.getElementById("answer").value="";document.getElementById("answer").focus()}else next(false)}}
function scrambleView(){let w=words[index],letters=[...w].sort(()=>Math.random()-.5);return shell("Letter Scramble",`Word ${index+1} of ${words.length}`,`<div class="playcard"><div class="tiles">${letters.map(x=>`<span>${esc(x.toUpperCase())}</span>`).join("")}</div><input id="answer" autofocus onkeydown="if(event.key==='Enter')checkGeneric()" placeholder="Build the word"><button class="primary purpleBtn" onclick="checkGeneric()">Check Word</button></div>`)}
function missingView(){let w=words[index],hidden=[...w].map((c,i)=>i%3===1?"_":c).join("");return shell("Missing Letters",`Word ${index+1} of ${words.length}`,`<div class="playcard"><div class="mystery">${hidden.toUpperCase()}</div><p>Fill in the missing letters to solve the mystery.</p><input id="answer" autofocus onkeydown="if(event.key==='Enter')checkGeneric()" placeholder="Type the complete word"><button class="primary greenBtn" onclick="checkGeneric()">Solve Mystery</button></div>`)}
function checkGeneric(){let v=document.getElementById("answer").value.trim().toLowerCase();next(v===words[index].toLowerCase())}
function summaryView(){let s=summary;return `<main class="summary"><div class="trophy">🏆</div><h1>Round Complete!</h1><p>You got <b>${s.correct} out of ${s.total}</b> words correct.</p><div class="score">⭐ Great work!</div><div class="summaryBtns"><button class="primary" onclick="start('${s.mode}')">↻ Play Again</button>${s.tricky.length?`<button class="secondary" onclick='start("${s.mode}",${JSON.stringify(s.tricky)})'>Practice Tricky Words</button>`:""}<button class="secondary" onclick="home()">Back to Games</button></div></main>`}
function openWords(){let overlay=document.createElement("div");overlay.className="overlay";overlay.innerHTML=`<div class="modal"><div class="modalHead"><h2>My Word Lists</h2><button onclick="this.closest('.overlay').remove()">✕</button></div><div id="listArea">${lists.map(l=>`<div class="listRow ${l.id===activeId?"selected":""}"><button onclick="selectList('${l.id}')"><b>${esc(l.name)}</b><small>${l.words.length} words</small></button>${l.id!=="starter"?`<button class="iconBtn" onclick="deleteList('${l.id}')">🗑</button>`:""}</div>`).join("")}</div><div class="addBox"><h3>＋ Create New List</h3><input id="listName" placeholder="List name"><textarea id="listWords" placeholder="Enter words separated by commas or lines"></textarea><button class="orange" onclick="addList()">Save Word List</button></div></div>`;document.body.appendChild(overlay)}
window.openWords=openWords;
window.selectList=function(id){activeId=id;save();document.querySelector(".overlay").remove();render()}
window.deleteList=function(id){if(lists.length>1){lists=lists.filter(x=>x.id!==id);if(activeId===id)activeId=lists[0].id;save();openWords()}}
window.addList=function(){let name=document.getElementById("listName").value.trim()||"My Word List",ws=document.getElementById("listWords").value.split(/[,\n]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);ws=[...new Set(ws)];if(!ws.length){toast("Enter at least one word.");return}let l={id:"list-"+Date.now(),name,words:ws};lists.push(l);activeId=l.id;save();document.querySelector(".overlay").remove();render()}
window.start=start;window.home=home;window.speak=speak;window.checkListen=checkListen;window.checkGeneric=checkGeneric;
render();
})();
</script>
</body>
</html>
